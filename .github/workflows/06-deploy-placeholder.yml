name: 06 Deploy Placeholder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_ENV: dev
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'dev-placeholder' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate dev deployment
        run: |
          echo "Deploying $GITHUB_SHA to $APP_ENV"
          echo "Target: $DEPLOY_TARGET"
          echo "A real workflow would authenticate with a secret here."

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod
    env:
      APP_ENV: prod
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'prod-placeholder' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate prod deployment
        run: |
          echo "Deploying $GITHUB_SHA to $APP_ENV"
          echo "Target: $DEPLOY_TARGET"
          echo "Configure required reviewers on the prod environment for approval practice."
          test -n "${{ secrets.DEPLOY_TOKEN || 'placeholder-only' }}"

