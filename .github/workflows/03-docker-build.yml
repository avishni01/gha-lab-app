name: 03 Docker Build

on:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker image locally
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gha-lab-app:${{ github.sha }} .

      - name: List image
        run: docker images gha-lab-app

